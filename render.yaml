# Render Blueprint: free Docker web service. Add the two secrets in the Render dashboard (sync: false).
services:
  - type: web
    name: dryrun
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: MODEL_VISION
        value: nvidia/Nemotron-3.5-Super-VL
      - key: TAVILY_API_KEY
        sync: false
      # Kill switch: set to false in the dashboard (Environment) to stop every paid Nemotron call; replays keep working.
      - key: LIVE_ENABLED
        value: "true"
