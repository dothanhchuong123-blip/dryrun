# Render Blueprint: free Docker web service. Add the two secrets in the Render dashboard (sync: false).
services:
  - type: web
    name: market-digital-twin
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
